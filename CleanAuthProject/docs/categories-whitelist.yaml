# Categorias excluídas do uso direto pelo agente e justificativas.
excluded_categories:
  - { id: 7,  name: "AJUDA E SUPORTE", reason: "Genérica/ambígua; não orienta ação específica" }
  - { id: 34, name: "ATENDIMENTO AO USUÁRIO", reason: "Genérica/ambígua; reservada como fallback" }
  - { id: 10, name: "RESET DE SENHA", reason: "Duplicada com id 24; usar id 24" }
  - { id: 33, name: "TÚNEL PROCERGS", reason: "Duplicada com id 11; usar id 11" }
  - { id: 15, name: "IMPRESSORA", reason: "Duplicada com id 14; usar id 14" }
  - { id: 35, name: "NOVO USUÁRIO", reason: "Duplicada com id 3; usar id 3" }
  - { id: 5,  name: "LISTA PUBLICA", reason: "Sem uso em 2025 (total 0)" }
  - { id: 28, name: "REQUISIÇÃO", reason: "Genérica; evita classificação imprecisa" }
  - { id: "(sem-nome)", reason: "IDs sem nome no GLPI (ex.: 0,1,42,44,56, etc.) não devem ser usados pelo agente" }

# Categoria de fallback para casos não cobertos pela whitelist.
fallback_category:
  id: 34
  name: "ATENDIMENTO AO USUÁRIO"
  agent_label: "Outros"
  context:
    keywords: ["atendimento", "suporte", "outros", "genérico", "telefone", "voip", "hardware", "office 365"]
    example_phrases:
      - "ajuda e suporte sem detalhamento"
      - "solicitação genérica sem categoria clara"
      - "telefone/voip/computador com problema (sem contexto suficiente)"
  usage_notes:
    - "Usar apenas quando nenhuma categoria selecionada se aplicar com confiança suficiente."
    - "Revisar periodicamente tickets classificados como 'Outros' para extrair novas subcategorias quando necessário."