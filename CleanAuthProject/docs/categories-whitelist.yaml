# Whitelist de categorias GLPI para uso pelo agente
# Base: análise 2025 (categories_usage_2025.json, report_categorias_2025.md, missing_categories_2025.json,
# audit_categorias_2025_avancado.md)

version: 1
generated_from:
  - categories_usage_2025.json
  - report_categorias_2025.md
  - missing_categories_2025.json
  - audit_categorias_2025_avancado.md

