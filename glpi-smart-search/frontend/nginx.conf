server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend (assumes backend is at 'backend' hostname in Docker network)
    # Note: This will be overridden by Traefik routing in most cases, but good for internal consistency
    location /api {
        proxy_pass http://glpi-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
